
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Novia ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 20px;
            border: 2px solid #eab308;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { 
            color: #eab308; 
            font-size: 26px; 
            margin-top: 0;
            margin-bottom: 20px; 
        }
        p { 
            font-size: 18px; 
            line-height: 1.6; 
            color: #cbd5e1; 
            text-align: left; 
            white-space: pre-line;
            margin: 0;
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #eab308;
            background: #0f172a;
            color: white;
            text-align: center;
            font-size: 18px;
        }
        button {
            background: #eab308;
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
        .hidden { 
            display: none !important; 
        }
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #eab308;
            margin-left: 2px;
            animation: parpadeo 0.7s infinite;
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- SÓLO UN CUADRO A LA VEZ -->
    <div id="pantalla-principal" class="container">
        
        <!-- PANTALLA 1: PEDIR NOMBRE -->
        <div id="login-box">
            <h1>🏴‍☠️ ¡Alto ahí! 🏴‍☠️</h1>
            <p style="text-align: center;">Para ingresar a este tesoro del Grand Line, por favor escribe tu nombre:</p>
            <input type="text" id="nombre-input" placeholder="Tu nombre aquí...">
            <button onclick="iniciarCarta()">Ingresar</button>
        </div>

        <!-- PANTALLA 2: CARTA OCULTA -->
        <div id="carta-box" class="hidden">
            <h1>¡Feliz Día de la Novia! 🏴‍☠️❤️</h1>
            <p><span id="texto-carta"></span><span id="cursor-efecto" class="cursor">&nbsp;</span></p>
        </div>

    </div>

    <script>
        var textoCompleto = "";

        function iniciarCarta() {
            var nombre = document.getElementById('nombre-input').value.trim();
            
            if (nombre !== "") {
                textoCompleto = "¡Hola, mi " + nombre + "! ✨\n\n" +
                                "Hoy en el Día de la Novia quería recordarte que eres mi tesoro más grande en todo el Grand Line.\n\n" +
                                "Desde que comenzamos este viaje juntos, supe que no importan las tormentas ni los caminos difíciles, porque tenerte a mi lado hace que cada aventura valga la pena.\n\n" +
                                "Gracias por ser mi compañera, por tu sonrisa y por hacerme tan feliz todos los días. ¡Te amo con todo mi corazón! En este viaje... ¡siempre juntos! 🏴‍☠️❤️";

                // Esto oculta el cuadro del nombre por completo y activa la carta
                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('carta-box').classList.remove('hidden');
                
                escribirLetraPorLetra(0);
            } else {
                alert("¡Por favor, escribe tu nombre para continuar! 😉");
            }
        }

        function escribirLetraPorLetra(indice) {
            if (indice < textoCompleto.length) {
                document.getElementById('texto-carta').innerHTML += textoCompleto.charAt(indice);
                setTimeout(function() {
                    escribirLetraPorLetra(indice + 1);
                }, 45);
            } else {
                document.getElementById('cursor-efecto').style.display = 'none';
            }
        }
    </script>
</body>
</html>
