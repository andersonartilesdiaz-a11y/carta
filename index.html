<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para el amor de mi vida ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #ffffff; /* Fondo totalmente blanco */
            color: #111827; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        h1 { 
            color: #e11d48; /* Rojo romántico elegante */
            font-size: 36px; 
            margin-top: 0;
            margin-bottom: 30px; 
        }
        p { 
            font-size: 26px; /* Letra gigante y muy cómoda de leer */
            line-height: 1.8; 
            color: #1f2937; 
            text-align: left; 
            white-space: pre-line;
            margin: 0;
        }
        .input-wrapper {
            max-width: 500px;
            margin: 0 auto;
        }
        input {
            width: 100%;
            padding: 20px;
            margin: 25px 0;
            border-radius: 14px;
            border: 2px solid #fda4af;
            background: #fff1f2;
            color: #9f1239;
            text-align: center;
            font-size: 24px; 
            outline: none;
        }
        button {
            background: #e11d48;
            color: white;
            border: none;
            padding: 20px 35px;
            font-size: 24px; 
            font-weight: bold;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { 
            background: #be123c; 
        }
        .hidden { 
            display: none !important; 
        }
        .cursor {
            display: inline-block;
            width: 4px;
            height: 30px;
            background-color: #e11d48;
            margin-left: 2px;
            vertical-align: middle;
            animation: parpadeo 0.7s infinite;
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PANTALLA 1: PIDE EL NOMBRE -->
        <div id="login-box" class="input-wrapper">
            <h1>Para el amor de mi vida ❤️</h1>
            <p style="text-align: center; font-size: 24px;">Escribe tu nombre aquí para abrir tu carta:</p>
            <input type="text" id="nombre-input" placeholder="Tu nombre...">
            <button onclick="iniciarCarta()">Abrir carta</button>
        </div>

        <!-- PANTALLA 2: LA CARTA LIMPIA SIN CAJAS -->
        <div id="carta-box" class="hidden">
            <h1>Para ti, mi amor ❤️</h1>
            <p><span id="texto-carta"></span><span id="cursor-efecto" class="cursor"></span></p>
        </div>

    </div>

    <script>
        var textoCompleto = "";

        function iniciarCarta() {
            var nombre = document.getElementById('nombre-input').value.trim();
            
            if (nombre !== "") {
                // Carta larga, romántica, aclarando que son novios y firmada por Anderson
                textoCompleto = "Mi querida y amada " + nombre + ",\n\n" +
                                "Esta carta es dedicada especialmente para ti. Hoy quiero recordarte lo inmensamente feliz que me hace tenerte en mi vida y poder llamarte mi novia.\n\n" +
                                "Desde el momento en que nos convertimos en novios, cada instante a tu lado ha sido maravilloso. Tu sonrisa, tus detalles y la forma en la que me quieres han transformado mis días por completo. Eres una mujer increíble, hermosa y con un corazón gigantesco que se merece todo lo bonito de este mundo.\n\n" +
                                "Quiero que sepas que estoy súper orgulloso de ti y de lo nuestro. Prometo cuidarte, respetarte y amarte todos los días de mi vida, estando a tu lado en cada momento.\n\n" +
                                "Te amo con todo mi corazón, hoy y siempre.\n\n" +
                                "Con todo mi amor,\n" +
                                "Tu novio, Anderson ❤️";

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('carta-box').classList.remove('hidden');
                
                escribirLetraPorLetra(0);
            } else {
                alert("Por favor, escribe tu nombre para abrir la carta.");
            }
        }

        function escribirLetraPorLetra(indice) {
            if (indice < textoCompleto.length) {
                document.getElementById('texto-carta').innerHTML += textoCompleto.charAt(indice);
                setTimeout(function() {
                    escribirLetraPorLetra(indice + 1);
                }, 35);
            } else {
                document.getElementById('cursor-efecto').style.display = 'none';
            }
        }
    </script>
</body>
</html>
