<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Día de la Novia ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #fff1f2; 
            color: #4c0519; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            width: 100vw; 
            min-height: 100vh; 
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        @media (min-width: 600px) {
            .container {
                width: 95%;
                max-width: 650px;
                min-height: 90vh;
                border-radius: 24px;
                box-shadow: 0 15px 40px rgba(251, 113, 133, 0.2);
            }
        }
        h1 { 
            color: #db2777; 
            font-size: 34px; 
            margin-top: 0;
            margin-bottom: 30px; 
            text-align: center;
        }
        p { 
            font-size: 24px; 
            line-height: 1.8; 
            color: #4c0519; 
            text-align: left; 
            white-space: pre-line;
            margin: 0;
            width: 100%;
        }
        .input-wrapper {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 18px;
            margin: 25px 0;
            border-radius: 12px;
            border: 2px solid #fbcfe8;
            background: #fff5f5;
            color: #881337;
            text-align: center;
            font-size: 22px; 
            outline: none;
        }
        button {
            background: #db2777;
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 22px; 
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { 
            background: #be185d; 
        }
        .hidden { 
            display: none !important; 
        }
        .cursor {
            display: inline-block;
            width: 4px;
            height: 28px;
            background-color: #db2777;
            margin-left: 2px;
            vertical-align: middle;
            animation: parpadeo 0.7s infinite;
        }
        @keyframes parpadeo {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- PANTALLA 1: INGRESO -->
        <div id="login-box" class="input-wrapper">
            <h1>Para alguien especial ❤️</h1>
            <p style="text-align: center; font-size: 22px;">Para descubrir el mensaje que tengo guardado para ti, escribe tu nombre aquí debajo:</p>
            <input type="text" id="nombre-input" placeholder="Tu nombre hermoso...">
            <button onclick="iniciarCarta()">Ver mi sorpresa</button>
        </div>

        <!-- PANTALLA 2: LA CARTA ENORME Y LARGA -->
        <div id="carta-box" class="hidden" style="width: 100%;">
            <h1>¡Feliz Día de la Novia! 💕</h1>
            <p><span id="texto-carta"></span><span id="cursor-efecto" class="cursor"></span></p>
        </div>

    </div>

    <script>
        var textoCompleto = "";

        function iniciarCarta() {
            var nombre = document.getElementById('nombre-input').value.trim();
            
            if (nombre !== "") {
                // Una carta mucho más larga, detallada y romántica
                textoCompleto = "¡Hola, mi hermosa " + nombre + "! ✨\n\n" +
                                "Hoy es el Día de la Novia, y no podía dejar pasar este momento sin recordarte lo increíblemente afortunado que me siento de tenerte en mi vida. Esta página es solo un pequeño detalle para intentar expresarte todo lo que significas para mí.\n\n" +
                                "Desde el día en que entraste a mi mundo, todo cambió para mejor. Me has enseñado lo bonito que es compartir los días con alguien que te apoya, te cuida y te llena de alegría con una sola mirada. Cada sonrisa tuya tiene el poder de iluminar hasta mi día más gris, y cada momento a tu lado se convierte en un recuerdo inolvidable.\n\n" +
                                "Gracias por ser mi paz, mi cómplice y la persona con la que quiero compartir cada paso de este camino. Valoro muchísimo tu ternura, tu paciencia y la forma tan única en la que me haces sentir amado todos los días. Eres, sin duda alguna, la novia más maravillosa, atenta y hermosa del universo entero.\n\n" +
                                "Espero que este día sea súper especial para ti, porque te mereces todo lo bueno que este mundo pueda ofrecer. Prometo seguir cuidando de nosotros y dar lo mejor de mí para hacerte tan feliz como tú me haces a mí.\n\n" +
                                "Te amo con cada rincón de mi corazón. ¡Feliz día hoy y siempre! ❤️✨";

                document.getElementById('login-box').classList.add('hidden');
                document.getElementById('carta-box').classList.remove('hidden');
                
                escribirLetraPorLetra(0);
            } else {
                alert("¡Por favor, escribe tu nombre para ver la sorpresa! 😉❤️");
            }
        }

        function escribirLetraPorLetra(indice) {
            if (indice < textoCompleto.length) {
                document.getElementById('texto-carta').innerHTML += textoCompleto.charAt(indice);
                setTimeout(function() {
                    escribirLetraPorLetra(indice + 1);
                }, 35); // Un pelín más rápido para que la lectura larga fluya increíble
            } else {
                document.getElementById('cursor-efecto').style.display = 'none';
            }
        }
    </script>
</body>
</html>
