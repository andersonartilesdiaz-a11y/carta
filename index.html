<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi novia</title>
    <style>
        body {
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            color: #4a0e17;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 400px;
        }
        h1 { color: #ff4d6d; }
        p { font-size: 18px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h1>¡Para la mejor novia del mundo! ❤️</h1>
        <p>Aquí puedes escribir todo el mensaje bonito que le quieras dedicar.</p>
    </div>
</body>
</html>
